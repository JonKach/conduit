name: Test Backend

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize

permissions: {}

jobs:
  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROJECT_NAME: Conduit
      ENVIRONMENT: local
      SECRET_KEY: ci-only-secret-key-that-is-at-least-32-bytes
      FIRST_SUPERUSER: admin@example.com
      FIRST_SUPERUSER_PASSWORD: ci-superuser-password
      POSTGRES_SERVER: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ci-postgres-password
      POSTGRES_DB: app
      REDIS_SERVER: localhost
      REDIS_PORT: 6379
      REDIS_PASSWORD: ci-redis-password
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          # Before upgrading uv version, make sure astral-sh/setup-uv knows its checksum.
          # See: https://github.com/astral-sh/setup-uv/issues/851#issuecomment-4282017837
          version: "0.11.4"
      # Service containers can't pass arguments to the image, so Redis (which
      # needs --requirepass) is started directly.
      - name: Start Redis
        run: |
          docker run -d --name redis -p 6379:6379 redis:7.4-alpine redis-server --requirepass "$REDIS_PASSWORD"
          until docker exec redis redis-cli -a "$REDIS_PASSWORD" ping 2>/dev/null | grep -q PONG; do sleep 1; done
      - name: Migrate and seed DB
        run: uv run bash scripts/prestart.sh
        working-directory: backend
      - name: Run tests
        run: uv run coverage run -m pytest -v
        working-directory: backend
      - name: Coverage report
        if: always()
        run: |
          uv run coverage report
          uv run coverage html --title "Coverage for ${GITHUB_SHA}"
        working-directory: backend
      - name: Store coverage files
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: coverage-html
          path: backend/htmlcov
          include-hidden-files: true
          
